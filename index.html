<script>
const SUPABASE_URL = "https://gncpzdpqqnqvlskuxmvh.supabase.co";
const SUPABASE_KEY = "sb_publishable_u5-svo35nbWAcBlZVNxSeg_m64tS-vW";

const searchInput = document.getElementById("searchInput");
const results = document.getElementById("results");

async function searchResources() {
    const query = searchInput.value.trim();

    if (!query) {
        results.innerHTML = `
            <div class="no-results">
                Escribe qué necesitas para tu clase.
            </div>
        `;
        return;
    }

    results.innerHTML = `
        <div class="loading">
            🔎 Buscando recursos para tu clase...
        </div>
    `;

    try {
        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/search_resources`,
            {
                method: "POST",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    search_query: query
                })
            }
        );

        const responseText = await response.text();

        if (!response.ok) {
            console.error("Error de Supabase:", responseText);
            throw new Error(responseText);
        }

        const data = JSON.parse(responseText);

        console.log("Resultados:", data);

        displayResults(data);

    } catch (error) {
        console.error("Error en el buscador:", error);

        results.innerHTML = `
            <div class="no-results">
                <h3>Ha ocurrido un error.</h3>
                <p>No hemos podido realizar la búsqueda.</p>
                <p>Abre la consola del navegador para ver el error.</p>
            </div>
        `;
    }
}


function displayResults(data) {

    if (!data || data.length === 0) {
        results.innerHTML = `
            <div class="no-results">
                <h3>No hemos encontrado recursos.</h3>
                <p>Prueba con otra búsqueda.</p>
            </div>
        `;
        return;
    }

    results.innerHTML = data.map(resource => {

        const ageText = getAgeText(
            resource.age_min,
            resource.age_max
        );

        return `
            <article class="resource-card">

                <div class="resource-type">
                    ${getResourceTypeName(resource.resource_type)}
                </div>

                <h3>${escapeHtml(resource.title)}</h3>

                <p>
                    ${escapeHtml(resource.description || "")}
                </p>

                <div class="resource-meta">

                    ${ageText ? `
                        <span>👦 ${ageText}</span>
                    ` : ""}

                    ${resource.je_rating ? `
                        <span>⭐ ${resource.je_rating}/5</span>
                    ` : ""}

                </div>

                <a href="recurso.html?id=${resource.id}">
                    Ver recurso →
                </a>

            </article>
        `;

    }).join("");
}


function getResourceTypeName(type) {

    const types = {
        juego: "🎮 Juego",
        libro: "📚 Libro",
        video: "🎥 Vídeo",
        cuenta: "👤 Cuenta",
        articulo: "📄 Artículo",
        herramienta: "🛠️ Herramienta",
        formacion: "🎓 Formación"
    };

    return types[type] || "Recurso";
}


function getAgeText(min, max) {

    if (!min && !max) {
        return "";
    }

    if (min && max) {
        return `${min}–${max} años`;
    }

    if (min) {
        return `Desde ${min} años`;
    }

    return `Hasta ${max} años`;
}


function handleEnter(event) {

    if (event.key === "Enter") {
        searchResources();
    }
}


function escapeHtml(value) {

    if (!value) {
        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>
